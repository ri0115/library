function a3ContainRect(){
 const at=document.getElementById("atlas");
 if(!at)return null;
 const w=at.clientWidth,h=at.clientHeight;
 /* Canonical coordinate space is always CONTAIN.
    The visible foreground layers are explicitly sized to this rectangle. */
 const u=Math.min(w/A3_IMG.w,h/A3_IMG.h);
 const rw=A3_IMG.w*u,rh=A3_IMG.h*u;
 return {atlas:at,left:(w-rw)/2,top:(h-rh)/2,width:rw,height:rh,unit:u,fit:"contain"};
}

function a3PositionImageLayers(){
 const g=a3ContainRect();if(!g)return;
 g.atlas.querySelectorAll(".home,.anatomy").forEach(img=>{
   img.style.setProperty("left",g.left+"px","important");
   img.style.setProperty("top",g.top+"px","important");
   img.style.setProperty("width",g.width+"px","important");
   img.style.setProperty("height",g.height+"px","important");
   img.style.setProperty("right","auto","important");
   img.style.setProperty("bottom","auto","important");
   img.style.setProperty("object-fit","fill","important");
 });
}

function a3PositionHitLayer(){
 const g=a3ContainRect();
 const homeLay=document.querySelector(".a3-hitlayer.home-hits");
 const zoomLay=document.querySelector(".a3-hitlayer.zoom-hits");
 if(!g||!homeLay||!zoomLay)return;
 a3PositionImageLayers();

 [homeLay,zoomLay].forEach(lay=>{
   lay.style.left=g.left+"px"; lay.style.top=g.top+"px";
   lay.style.width=g.width+"px"; lay.style.height=g.height+"px";
   lay.style.right="auto"; lay.style.bottom="auto";
 });

 homeLay.querySelectorAll("[data-a3zone]").forEach(b=>{
   const q=A3_HOME_HITS[b.dataset.a3zone];
   b.style.left=(q[0]/A3_IMG.w*100)+"%";
   b.style.top=(q[1]/A3_IMG.h*100)+"%";
   b.style.width=((q[2]-q[0])/A3_IMG.w*100)+"%";
   b.style.height=((q[3]-q[1])/A3_IMG.h*100)+"%";
 });

 zoomLay.querySelectorAll("[data-a3zone]").forEach(b=>{
   const q=A3_COLOR_TARGETS[b.dataset.a3zone];
   b.style.left=(q[0]/A3_IMG.w*100)+"%";
   b.style.top=(q[1]/A3_IMG.h*100)+"%";
   b.style.width=((q[2]-q[0])/A3_IMG.w*100)+"%";
   b.style.height=((q[3]-q[1])/A3_IMG.h*100)+"%";
 });
}

function a3ApplyZoom(key){
 const g=a3ContainRect(),m=A3_META[key],q=A3_COLOR_TARGETS[key];
 if(!g||!m||!q)return;
 a3PositionImageLayers();
 const cx=(q[0]+q[2])/2,cy=(q[1]+q[3])/2;
 const localX=cx*g.unit, localY=cy*g.unit;
 const S=m.scale;
 /* anatomy element starts at g.left/g.top.
    Translate in its local coordinate system so target center lands at atlas center. */
 const tx=(g.atlas.clientWidth/2-g.left)-S*localX;
 const ty=(g.atlas.clientHeight/2-g.top)-S*localY;
 const home=g.atlas.querySelector(".home");
 const anatomy=g.atlas.querySelector(".anatomy");
 if(home){
   home.style.setProperty("opacity","0.30","important");
   home.style.setProperty("transform","none","important");
 }
 if(anatomy){
   anatomy.style.setProperty("opacity","1","important");
   anatomy.style.setProperty("transform-origin","0 0","important");
   anatomy.style.setProperty("transform",`translate(${tx}px,${ty}px) scale(${S})`,"important");
 }
 const homeHits=g.atlas.querySelector(".a3-hitlayer.home-hits");
 const zoomHits=g.atlas.querySelector(".a3-hitlayer.zoom-hits");
 if(homeHits){
   homeHits.style.pointerEvents="none";
   homeHits.querySelectorAll(".a3-hit").forEach(b=>b.disabled=true);
 }
 if(zoomHits){
   zoomHits.style.setProperty("transform-origin","0 0","important");
   zoomHits.style.setProperty("transform",`translate(${tx}px,${ty}px) scale(${S})`,"important");
   zoomHits.style.pointerEvents="auto";
   zoomHits.querySelectorAll(".a3-hit").forEach(b=>b.disabled=false);
 }
 g.atlas.classList.add("reveal","a3-zoom");g.atlas.dataset.zoomed="1";
}

function a3Close(){
 document.getElementById("a3Shade").classList.remove("open");
 document.getElementById("a3Popup").classList.remove("open");
 document.getElementById("a3Popup").setAttribute("aria-hidden","true");
 setOverlayOpen("a3",false);
}

function a3Select(label){
 closeDetail();
 structure="";sub=label;
 const tagEl=document.getElementById("tag");
 if(tagEl)tagEl.textContent=label+" — 選択中";

/* Single authoritative reset for the anatomy map. */
function resetAtlas(){
 closeDetail();
 area="";structure="";sub="";
 const at=document.getElementById("atlas");
 const finish=()=>{
   if(!at)return;
   at.classList.remove("reveal","a3-zoom","returning");
   const home=at.querySelector(".home"),anatomy=at.querySelector(".anatomy");
   [home,anatomy].forEach(el=>{
     if(!el)return;
     el.style.removeProperty("transform");
     el.style.removeProperty("transform-origin");
     el.style.removeProperty("opacity");
   });
   if(home)home.style.setProperty("opacity","1","important");
   if(anatomy)anatomy.style.setProperty("opacity","0","important");
   at.dataset.zoomed="";
   const homeHits=at.querySelector(".a3-hitlayer.home-hits");
   const zoomHits=at.querySelector(".a3-hitlayer.zoom-hits");
   if(homeHits){
     homeHits.style.pointerEvents="auto";
     homeHits.querySelectorAll(".a3-hit").forEach(b=>b.disabled=false);
   }
   if(zoomHits){
     zoomHits.style.pointerEvents="none";
     zoomHits.querySelectorAll(".a3-hit").forEach(b=>b.disabled=true);
     zoomHits.style.removeProperty("transform");
     zoomHits.style.removeProperty("transform-origin");
   }
   a3PositionHitLayer();
   a3PositionImageLayers();
 };
 if(at){
   const home=at.querySelector(".home"),anatomy=at.querySelector(".anatomy");
   const wasZoomed=at.dataset.zoomed==="1";
   if(wasZoomed && anatomy){
     at.classList.add("returning");
     // Stage 1: keep the color figure visible and let the camera glide back to the whole body.
     anatomy.style.setProperty("opacity","1","important");
     anatomy.style.setProperty("transform-origin","0 0","important");
     anatomy.style.setProperty("transform","translate(0px,0px) scale(1)","important");
     if(home)home.style.setProperty("opacity","0","important");
     // Stage 2: after landing, crossfade color -> classical figure.
     window.setTimeout(()=>{
       if(home)home.style.setProperty("opacity","1","important");
       if(anatomy)anatomy.style.setProperty("opacity","0","important");
       window.setTimeout(finish,280);
     },720);
   }else{
     finish();
   }
 }
 a3Close();
 const tagEl=document.getElementById("tag");
 if(tagEl)tagEl.textContent="人体索引 — 部位をタップ";
 const dbg=document.getElementById("a3DebugReadout");if(dbg)dbg.textContent="RESET → HOME | v31";
}

function a3Install(){
 const at=document.getElementById("atlas");if(!at)return;
 at.querySelectorAll(".a3-hitlayer").forEach(x=>x.remove());

 const makeLayer=(extra,keys)=>{
   const lay=document.createElement("div");
   lay.className="a3-hitlayer "+extra;
   keys.forEach(k=>{
     const b=document.createElement("button");
     b.type="button";b.className="a3-hit";b.dataset.a3zone=k;
     b.setAttribute("aria-label",A3_META[k].name);
     b.onclick=e=>{e.preventDefault();e.stopPropagation();a3Open(k)};
     lay.appendChild(b);
   });
   return lay;
 };

 const homeLay=makeLayer("home-hits",Object.keys(A3_HOME_HITS));
 const zoomLay=makeLayer("zoom-hits",Object.keys(A3_COLOR_TARGETS));
 zoomLay.style.pointerEvents="none";
 zoomLay.querySelectorAll(".a3-hit").forEach(b=>b.disabled=true);
 at.appendChild(homeLay);
 at.appendChild(zoomLay);
 a3PositionHitLayer();
 a3PositionImageLayers();
 document.getElementById("a3Shade").onclick=a3Close;
 document.getElementById("a3Close").onclick=a3Close;
 document.getElementById("a3Body").onclick=e=>{const b=e.target.closest("[data-a3item]");if(b)a3Select(b.dataset.a3item)};
 if(new URLSearchParams(location.search).get("debug")==="1")document.body.classList.add("a3-debug");
 window.addEventListener("resize",()=>{a3PositionHitLayer();a3PositionImageLayers();},{passive:true});
 window.a3Verify=()=>{
   const g=a3ContainRect(),back=document.getElementById("backToWhole");
   const zones={};
   document.querySelectorAll("[data-a3zone]").forEach(b=>{
     const r=b.getBoundingClientRect();zones[b.dataset.a3zone]=[Math.round(r.left),Math.round(r.top),Math.round(r.right),Math.round(r.bottom)];
   });
   const br=back?.getBoundingClientRect();
   return {atlas:[g?.atlas.clientWidth,g?.atlas.clientHeight],image:[g?.left,g?.top,g?.width,g?.height],
           back:br&&[br.left,br.top,br.right,br.bottom],zones};
 };
}
document.addEventListener("DOMContentLoaded",a3Install);

/* VIEW MODE */
function safeStoreGet(key,fallback){
 try{return localStorage.getItem(key)||fallback}catch(_){return fallback}
}
function safeStoreSet(key,value){
 try{localStorage.setItem(key,value)}catch(_){}
}
let VIEW_MODE=safeStoreGet("guidelineViewMode","atlas");
function setViewMode(mode){
 VIEW_MODE=(mode==="library")?"library":"atlas";
 safeStoreSet("guidelineViewMode",VIEW_MODE);
 document.body.classList.toggle("library-only",VIEW_MODE==="library");
 document.getElementById("modeAtlasBtn")?.classList.toggle("active",VIEW_MODE==="atlas");
 document.getElementById("modeLibraryBtn")?.classList.toggle("active",VIEW_MODE==="library");
 if(VIEW_MODE==="library"){closeDetail();a3Close();}
 window.setTimeout(enhanceLibraryRows,0);
}
function enhanceLibraryRows(){
 document.querySelectorAll(".card").forEach(card=>{
   if(card.querySelector(".libraryLedgerMeta"))return;
   const onclick=card.getAttribute("onclick")||"";
   const mm=onclick.match(/openD\(['"]([^'"]+)['"]\)/);
   if(!mm)return;
   const r=DATA.find(x=>x.id===mm[1]);if(!r)return;
   const meta=document.createElement("div");meta.className="libraryLedgerMeta";
   const cells=[
     ["発行年",r.year||"—"],
     ["診療科",r.specialtyLabel||r.specialty||"—"],
     ["作成団体",r.organization||"—"],
     ["疾患・領域",r.diseases||r.diseaseCategory||"—"],
     ["アクセス",r.accessLabel||r.access||"—"]
   ];
   meta.innerHTML=cells.map(([k,v])=>`<div class="libraryLedgerCell"><b>${esc(k)}</b>${esc(v)}</div>`).join("");
   card.appendChild(meta);
 });
}
const _baseRender=render;
render=function(){const v=_baseRender.apply(this,arguments);window.setTimeout(enhanceLibraryRows,0);return v;};


/* CSV EXPORT — exports the currently rendered/filtered catalogue */
function csvCell(v){
 const x=(v===null||v===undefined)?"":String(v);
 return `"${x.replace(/"/g,'""')}"`;
}
function currentVisibleGuidelines(){return LAST_FILTERED.length?LAST_FILTERED:DATA}
function exportVisibleCSV(){
 const src=currentVisibleGuidelines();
 const headers=["ID","ガイドライン名","発行年","作成団体","出版社","診療科","疾患カテゴリ","疾患・キーワード","身体領域","アクセス","価格","公式URL","全文URL","Minds URL","確認状況"];
 const lines=[headers.map(csvCell).join(",")];
 src.forEach(r=>lines.push([
   r.id,r.title,r.year,r.organization,r.publisher,r.specialtyLabel||r.specialty,
   r.diseaseCategory,r.diseases,r.bodyRegions||r.body,r.access,r.price,
   r.official,r.fulltext,r.minds,r.verified
 ].map(csvCell).join(",")));
 const blob=new Blob(["\uFEFF"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 const d=new Date(), pad=n=>String(n).padStart(2,"0");
 a.download=`medical_guidelines_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${src.length}records.csv`;
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}


function showBootError(err){
 try{
   const box=document.getElementById("bootError");
   if(box){
     box.hidden=false;
     box.textContent="表示の初期化に失敗しました。ページを再読み込みしてください。";
   }
   console.error("GUIDELINE_BOOT_ERROR",err);
 }catch(_){}
}
function bootApp(){
 try{
   initializeData();
   setViewMode(VIEW_MODE);
   if(typeof a3PositionImageLayers==="function")a3PositionImageLayers();
   if(typeof a3PositionHitLayer==="function")a3PositionHitLayer();
   document.documentElement.setAttribute("data-app-ready","1");
 }catch(err){
   document.documentElement.setAttribute("data-app-ready","0");
   showBootError(err);
 }
}
if(document.readyState==="loading"){
 document.addEventListener("DOMContentLoaded",bootApp,{once:true});
}else{
 bootApp();
}
