<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Medical Guideline Library</title>
<style>
:root{--ink:#3c2817;--muted:#745b3e;--line:#68452355;--paper:#e4c590;--dark:#2c1d12}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#1b1008;color:var(--ink)}
body{font-family:"Yu Mincho","Hiragino Mincho ProN",Georgia,serif}
.app{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 410px;background:linear-gradient(90deg,#8c5d34,#d2a86d 8%,#dfc18a 50%,#b77e48)}
.atlas{position:relative;overflow:hidden;min-height:100vh;touch-action:manipulation}.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .55s,transform .82s cubic-bezier(.2,.8,.2,1);transform-origin:50% 50%}
.home{opacity:1}.anatomy{opacity:0;filter:sepia(.10) saturate(.9);mix-blend-mode:multiply}.atlas.reveal .home{opacity:.11}.atlas.reveal .anatomy{opacity:1}.atlas.zoom .layer,.atlas.zoom .map{transform:translate(var(--tx),var(--ty)) scale(var(--s))}
.map{position:absolute;inset:0;z-index:6;transition:transform .82s cubic-bezier(.2,.8,.2,1);transform-origin:50% 50%;pointer-events:none}
.zone{position:absolute;border:0;background:transparent;pointer-events:auto;cursor:pointer;border-radius:20%;-webkit-tap-highlight-color:transparent}.poly{clip-path:polygon(var(--poly));border-radius:0}.zone:hover,.zone:focus{outline:1px dashed #5b381f99;background:#f4d18a25}.zone:active{background:#8d5d2f35}.zone.chosen{outline:2px solid #5c351dcc;background:#d7a65742;box-shadow:0 0 0 5px #f1d49c33 inset}
.zone::after{content:attr(data-label);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:9px Georgia,serif;letter-spacing:.05em;color:#4a2f19;opacity:0;white-space:nowrap;text-shadow:0 1px #f1d49c}.atlas.reveal .zone:hover::after{opacity:1}
.tag,.back,.catalogBtn{position:absolute;z-index:12;border:1px solid var(--line);background:#e6c68edb;box-shadow:2px 3px 9px #38200e44;font:11px inherit;color:var(--ink)}
.tag{top:16px;left:16px;padding:9px 12px}.back{right:16px;bottom:16px;padding:9px 12px}.catalogBtn{right:16px;top:16px;padding:9px 12px}
.catalog{min-height:100vh;background:#dfc18be9;border-left:1px solid var(--line);padding:18px;box-shadow:-5px 0 20px #24140755}.brand{font:20px/1.05 Georgia,serif;letter-spacing:.12em;margin-bottom:14px}.brand small{font:10px "Yu Mincho",serif;letter-spacing:.18em}
.search{display:flex;border:1px solid var(--line);background:#edd09c}.search input{flex:1;min-width:0;border:0;background:none;padding:11px;font:13px inherit;outline:0}.search button{border:0;border-left:1px solid var(--line);background:none;font-family:inherit;padding:0 12px}
.crumb{font-size:10px;opacity:.64;margin:8px 0 12px}.filters{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:9px}.filterTitle{display:flex;justify-content:space-between;align-items:center;font:12px Georgia,serif;letter-spacing:.08em;cursor:pointer}.filterBody{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.filterBody.hidden{display:none}
select{width:100%;border:1px solid var(--line);background:#e8c990;color:var(--ink);padding:7px 5px;font:11px inherit}.reset{grid-column:1/-1;border:1px solid var(--line);background:transparent;padding:6px;font:10px inherit;color:var(--ink)}
h2{font:16px Georgia,serif;letter-spacing:.06em;margin:10px 0}.subs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}.subs button{border:1px solid var(--line);background:#e7c78e;padding:5px 7px;font:10px inherit}.subs button.on{background:var(--dark);color:#eed6a9}
.results{max-height:58vh;overflow:auto}.card{padding:9px 2px;border-top:1px solid var(--line);cursor:pointer}.card:hover{background:#f1d5a33d}.title{font-size:12px;line-height:1.5}.meta{font-size:9px;opacity:.68;margin-top:3px}.badge{display:inline-block;border:1px solid var(--line);font-size:8px;padding:1px 4px;margin-top:4px}.hint{font-size:9px;line-height:1.65;opacity:.62}
.drawer{position:fixed;right:0;top:0;width:min(510px,100%);height:100%;z-index:40;background:#dfbf85;padding:24px;box-shadow:-10px 0 30px #160d0788;transform:translateX(105%);transition:.35s;overflow:auto}.drawer.open{transform:none}.x{float:right;border:0;background:none;font-size:26px}.drawer h1{font-size:20px;line-height:1.55}.dl{display:grid;grid-template-columns:85px 1fr;gap:7px 12px;font-size:12px;margin:20px 0}.dl b{opacity:.58}.links{display:grid;gap:7px}.links a{color:var(--ink);text-decoration:none;border:1px solid var(--line);padding:9px;background:#ebcd96}
.mobileSheet{display:none}
@media(max-width:850px){.app{display:block}.atlas{height:66vh;min-height:510px}.catalog{min-height:auto;border-left:0;border-top:1px solid var(--line);padding:13px}.brand{font-size:15px}.results{max-height:none}.tag{top:8px;left:8px}.back{right:8px;bottom:8px}.catalogBtn{top:8px;right:8px}.filterBody{grid-template-columns:1fr 1fr}.zone::after{display:none}}
.routeSearch{margin:10px 0 0;padding:10px 0;border-top:1px solid var(--line)}.specialtySearch{margin:10px 0 12px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.specialtyHead{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:bold;margin-bottom:8px}.specialtyHead button{border:1px solid var(--line);background:transparent;font:9px inherit;color:var(--ink);padding:3px 7px}
.specialtyChips{display:flex;gap:5px;flex-wrap:wrap;max-height:96px;overflow:auto}.specialtyChips button{border:1px solid var(--line);background:#e8ca94;color:var(--ink);font:10px inherit;padding:5px 7px;cursor:pointer}.specialtyChips button.on{background:#352215;color:#f0d7aa}
.resultTools{display:flex;justify-content:space-between;align-items:center}.resultTools select{width:auto;min-width:92px}.matchwhy{font-size:8px;opacity:.55;margin-top:3px}
/* v12 UX */
.uxbar{position:sticky;top:0;z-index:50;background:rgba(238,224,190,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:7px 0}
.uxinner{display:flex;gap:7px;align-items:center}.uxinner input{flex:1;margin:0}.uxbtn{width:auto;white-space:nowrap}
.activeFilters{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}.filterChip{border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:9px;background:rgba(255,255,255,.25)}
.resultCount{font-size:10px;opacity:.65;margin-left:6px;font-weight:400}
#toTop{position:fixed;right:15px;bottom:18px;z-index:80;width:42px;height:42px;border-radius:50%;display:none}
.mobileFilterBtn{display:none}
.emptyState{text-align:center;padding:32px 14px;border:1px dashed var(--line);margin-top:12px}
@media(max-width:760px){
 .mobileFilterBtn{display:inline-block}
 .filtersPanel{display:none}.filtersPanel.open{display:block}
 .uxinner{padding:0 8px}.uxinner input{min-width:0}
 .atlas{min-height:54vh}.catalog{padding-top:4px}
 .resultTools{position:sticky;top:49px;z-index:20;background:rgba(238,224,190,.93);padding:6px 0}
}
</style></head><body>
<div class="uxbar"><div class="uxinner">
<input id="quickSearch" placeholder="ガイドライン名・疾患・学会名を検索" oninput="syncQuickSearch(this.value)">
<button class="uxbtn mobileFilterBtn" onclick="toggleFilters()">絞り込み</button>
<button class="uxbtn" onclick="resetAll()">リセット</button>
</div><div id="activeFilters" class="activeFilters"></div></div>
<button id="toTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="ページ上部へ">↑</button><div class="app">
<main class="atlas" id="atlas">
<img class="layer home" src="home_atlas.png" alt="古典人体図"><img class="layer anatomy" src="anatomy_color.png" alt="カラー解剖図">
<div class="tag" id="tag">人体索引 — 部位をタップ</div><button class="catalogBtn" onclick="document.getElementById('q').focus()">蔵書検索</button>
<div class="map" id="map">
<!-- first-stage body locations -->
<button class="zone" data-label="頭部" style="left:45%;top:10%;width:10%;height:10%" onclick="focusArea('head')"></button>
<button class="zone" data-label="頸部" style="left:46%;top:20%;width:8%;height:7%" onclick="focusArea('neck')"></button>
<button class="zone" data-label="胸部" style="left:42%;top:28%;width:16%;height:15%" onclick="focusArea('chest')"></button>
<button class="zone" data-label="腹部" style="left:43%;top:43%;width:14%;height:15%" onclick="focusArea('abdomen')"></button>
<button class="zone" data-label="骨盤" style="left:43%;top:58%;width:14%;height:10%" onclick="focusArea('pelvis')"></button>
<button class="zone" data-label="左手" style="left:20%;top:43%;width:9%;height:11%" onclick="selectStructure('hand','手・手関節')"></button>
<button class="zone" data-label="右手" style="left:71%;top:43%;width:9%;height:11%" onclick="selectStructure('hand','手・手関節')"></button>
<button class="zone" data-label="左膝" style="left:43%;top:71%;width:6%;height:7%" onclick="selectStructure('knee','膝')"></button>
<button class="zone" data-label="右膝" style="left:51%;top:71%;width:6%;height:7%" onclick="selectStructure('knee','膝')"></button>
<button class="zone" data-label="左足" style="left:42%;top:90%;width:7%;height:7%" onclick="selectStructure('foot','足・足関節')"></button>
<button class="zone" data-label="右足" style="left:51%;top:90%;width:7%;height:7%" onclick="selectStructure('foot','足・足関節')"></button>
</div><button class="back" onclick="resetAtlas()">← 全身へ戻る</button></main>
<aside class="catalog"><div class="brand">MEDICAL GUIDELINE LIBRARY<br><small>診療ガイドライン図書館</small></div>
<div class="search"><input id="q" placeholder="疾患名・学会名・ガイドライン名…" oninput="render()"><button>検索</button></div><div class="crumb" id="crumb">全身 ＞ 全ガイドライン</div>
<div class="filtersPanel" id="filtersPanel"><section class="routeSearch"><div class="specialtyHead">探し方</div><div class="specialtyChips">
<button onclick="setRoute('')">すべて</button><button onclick="setRoute('body')">人体・臓器から</button><button onclick="setRoute('systemic')">全身・部位によらない</button>
</div></section><section class="specialtySearch">

<div class="specialtyChips" id="specialtyChips"></div>
</section>
<div class="filters"><div class="filterTitle" onclick="toggleFilters()">蔵書目録 / カテゴリ検索 <span id="fmark">−</span></div><div class="filterBody" id="filterBody">
<select id="fSpecialty" onchange="render()"><option value="">診療科：すべて</option></select><select id="fDisease" onchange="render()"><option value="">疾患群：すべて</option></select>
<select id="fBody" onchange="render()"><option value="">身体部位：すべて</option></select><select id="fOrg" onchange="render()"><option value="">発行学会：すべて</option></select>
<select id="fYear" onchange="render()"><option value="">発行年：すべて</option></select><select id="fAccess" onchange="render()"><option value="">アクセス：すべて</option></select>
<button class="reset" onclick="clearFilters()">検索条件をクリア</button></div></div>
<div class="crumb" id="activeFilters"></div></div><div class="resultTools"><h2 id="heading">蔵書一覧</h2><select id="sortMode" onchange="render()"><option value="new">新しい順</option><option value="old">古い順</option><option value="title">名称順</option></select></div><div class="subs" id="subs"></div><div class="results" id="results"></div><p class="hint">分類は原データを保持したまま、検索時のみ表記揺れ（例：頚椎→頸椎、膝関節→膝）を吸収します。</p><p class="hint">人体マップとカテゴリ検索は同じ検索状態として連動します。人体索引は身体部位・疾患・タイトルを優先して照合します。ズーム後は臓器輪郭に沿った不定形タップ領域へ切り替わります。臓器選択後も発行年・学会・アクセス条件を追加できます。</p></aside></div>
<aside class="drawer" id="drawer"><button class="x" onclick="drawer.classList.remove('open')">×</button><div id="detail"></div></aside>
<script>
let DATA=[],area="",structure="",sub="",route="";
const JP={
"PAID":"有料","PAYD":"有料","FREE":"無料","OPEN_ACCESS":"無料公開","OPEN":"無料公開",
"MEMBER_ONLY":"会員限定","MEMBERS_ONLY":"会員限定","MEMBER":"会員限定",
"PARTIAL_FREE":"一部無料","WEB_FREE":"Web無料公開","BOOK_ONLY":"書籍のみ",
"PURCHASE":"購入","PAID_BOOK":"有料（書籍）","FREE_PDF":"無料PDF",
"UNVERIFIED":"未確認","PENDING":"確認中","UNKNOWN":"未確認",
"PRIMARY":"診療ガイドライン","GUIDANCE":"指針・手引き","OTHER":"その他",
"ORTHOPEDICS":"整形外科","UROLOGY":"泌尿器科","GYNECOLOGY":"婦人科","OBGYN":"産婦人科",
"NEUROLOGY":"神経内科","NEUROSURGERY":"脳神経外科","CARDIOLOGY":"循環器内科",
"RESPIRATORY":"呼吸器","GASTROENTEROLOGY":"消化器","HEPATOLOGY":"肝胆膵",
"PEDIATRICS":"小児科","DERMATOLOGY":"皮膚科","OPHTHALMOLOGY":"眼科",
"OTOLARYNGOLOGY":"耳鼻咽喉科","PSYCHIATRY":"精神科","RHEUMATOLOGY":"リウマチ科",
"ENDOCRINOLOGY":"内分泌・代謝","HEMATOLOGY":"血液内科","ONCOLOGY":"腫瘍",
"INFECTIOUS_DISEASE":"感染症","EMERGENCY":"救急","ANESTHESIOLOGY":"麻酔科",
"REHABILITATION":"リハビリテーション科"
};
function jp(v){
 if(v===null||v===undefined||v==="")return "";
 let x=String(v).trim(),u=x.toUpperCase().replace(/[\s-]+/g,"_");
 return JP[u]||JP[x]||x.replace(/_/g," ");
}

const A={head:{n:"頭部",s:2.35,x:"0%",y:"31%"},neck:{n:"頸部",s:2.65,x:"0%",y:"25%"},chest:{n:"胸部",s:2.15,x:"0%",y:"14%"},abdomen:{n:"腹部",s:2.35,x:"0%",y:"-3%"},pelvis:{n:"骨盤",s:2.45,x:"0%",y:"-20%"}};
const S={
brain:{n:"脳",k:["脳","神経","頭蓋"]},eye:{n:"眼",k:["眼","視"]},thyroid:{n:"甲状腺",k:["甲状腺"]},lung:{n:"肺・呼吸器",k:["肺","呼吸","気管支"]},heart:{n:"心臓",k:["心","循環","冠動脈"]},breast:{n:"乳腺",k:["乳"]},
liver:{n:"肝臓",k:["肝"]},gall:{n:"胆嚢・胆道",k:["胆"]},pancreas:{n:"膵臓",k:["膵"]},stomach:{n:"胃",k:["胃"]},smallint:{n:"小腸",k:["小腸"]},colon:{n:"大腸・直腸",k:["大腸","結腸","直腸"]},kidney:{n:"腎臓",k:["腎"]},bladder:{n:"膀胱・尿路",k:["膀胱","尿路","泌尿"]},prostate:{n:"前立腺",k:["前立腺"]},uterus:{n:"子宮・卵巣",k:["子宮","卵巣","婦人"]},
hand:{n:"手・手関節",k:["手","手関節","手外科"]},knee:{n:"膝",k:["膝","半月板","前十字","靱帯"]},foot:{n:"足・足関節",k:["足","足関節"]},
shoulder:{n:"肩関節",k:["肩","肩関節","腱板","上腕二頭筋"]},
elbow:{n:"肘関節",k:["肘","肘関節"]},
wrist:{n:"手・手関節",k:["手","手関節","手外科","手根"]},
hip:{n:"股関節",k:["股","股関節","大腿骨頭"]},
cspine:{n:"頸椎",k:["頸椎","頚椎","頸部脊椎"]},
tspine:{n:"胸椎",k:["胸椎"]},
lspine:{n:"腰椎",k:["腰椎","腰部脊椎","腰痛"]},
ankle:{n:"足関節",k:["足関節","足首","距骨"]}
};
const subs={hand:["手外科","末梢神経","腱・靱帯","骨折"],knee:["変形性膝関節症","靱帯・半月板","骨折","スポーツ"],foot:["足外科","足関節","腱・靱帯","骨折"],liver:["肝炎","肝硬変","肝癌"],lung:["肺癌","喘息","COPD","感染症"],heart:["虚血性心疾患","心不全","不整脈"],kidney:["CKD","腎炎","腎癌"],
shoulder:["腱板","肩関節不安定症","変形性肩関節症","骨折","スポーツ"],
elbow:["上顆炎","靱帯","骨折","スポーツ"],
wrist:["手外科","末梢神経","腱・靱帯","骨折"],
hip:["変形性股関節症","大腿骨頭壊死","骨折","スポーツ"],
cspine:["頸椎症","頸椎椎間板","脊髄症","骨折"],
tspine:["胸椎","脊髄","骨折"],
lspine:["腰痛","腰部脊柱管狭窄症","椎間板","腰椎分離症","骨折"],
ankle:["足関節","アキレス腱","靱帯","骨折","スポーツ"]};
fetch("guidelines.json").then(r=>r.json()).then(d=>{DATA=d.map(r=>({...r,
specialtyLabel:jp(r.specialtyLabel||r.specialty),
accessLabel:jp(r.access),
verifiedLabel:jp(r.verified)
}));buildFilters();render()});
function T(r){return [r.title,r.organization,r.publisher,r.specialtyLabel,r.specialty,r.specialty2,r.diseaseCategory,r.diseaseGroup,r.diseases,r.body,r.bodyRegions,r.searchAliases].join(" ")}
function fieldText(r){return {title:String(r.title||""),disease:[r.diseaseCategory,r.diseaseGroup,r.diseases].join(" "),body:[r.body,r.bodyRegions].join(" "),specialty:[r.specialtyLabel,r.specialty,r.specialty2].join(" ")}}
function anatomyMatch(r,key){if(!key)return true;let f=fieldText(r),ks=S[key].k;return ks.some(k=>f.body.includes(k)||f.disease.includes(k)||f.title.includes(k))}
function subMatch(r,x){if(!x)return true;let f=fieldText(r);return x.split("・").filter(Boolean).some(k=>f.disease.includes(k)||f.body.includes(k)||f.title.includes(k))}
function focusArea(k){area=k;structure="";sub="";let c=A[k],a=atlas;a.classList.add("reveal","zoom");a.style.setProperty("--s",c.s);a.style.setProperty("--tx",c.x);a.style.setProperty("--ty",c.y);tag.textContent=c.n+" — 解剖構造を選択";installOrganZones(k);render()}
function installOrganZones(k){
let m=document.getElementById("map");let base=`<button class="zone" data-label="全身へ" style="left:2%;top:86%;width:7%;height:7%" onclick="resetAtlas()"></button>`;let z="";
if(k==="head")z=`
<button class="zone poly" data-label="脳" style="left:46.2%;top:10.7%;width:7.8%;height:7.4%;--poly:18% 15%,45% 3%,76% 13%,94% 42%,82% 78%,55% 96%,24% 88%,5% 58%" onclick="selectStructure('brain')"></button>
<button class="zone poly" data-label="眼" style="left:47.1%;top:17.2%;width:5.8%;height:2.5%;--poly:2% 50%,20% 12%,46% 6%,58% 8%,82% 16%,98% 50%,82% 84%,58% 92%,45% 90%,18% 84%" onclick="selectStructure('eye')"></button>`;
if(k==="neck")z=`
<button class="zone poly" data-label="甲状腺" style="left:47.2%;top:23.1%;width:5.6%;height:3.9%;--poly:5% 18%,30% 5%,47% 34%,52% 34%,70% 5%,95% 18%,82% 90%,57% 70%,50% 55%,43% 70%,18% 90%" onclick="selectStructure('thyroid')"></button>`;
if(k==="chest")z=`
<button class="zone poly" data-label="右肺" style="left:42.8%;top:29.2%;width:7.2%;height:12.4%;--poly:38% 0%,75% 8%,94% 34%,85% 78%,58% 100%,22% 92%,3% 58%,10% 20%" onclick="selectStructure('lung')"></button>
<button class="zone poly" data-label="左肺" style="left:50.1%;top:29.2%;width:7.2%;height:12.4%;--poly:62% 0%,25% 8%,6% 34%,15% 78%,42% 100%,78% 92%,97% 58%,90% 20%" onclick="selectStructure('lung')"></button>
<button class="zone poly" data-label="心臓" style="left:47.5%;top:33.2%;width:6.8%;height:8.3%;--poly:48% 0%,78% 16%,96% 48%,73% 86%,48% 100%,15% 74%,3% 38%,25% 10%" onclick="selectStructure('heart')"></button>
<button class="zone poly" data-label="乳腺" style="left:41.6%;top:29.4%;width:17%;height:8%;--poly:2% 48%,13% 18%,31% 5%,48% 24%,52% 24%,69% 5%,87% 18%,98% 48%,88% 88%,67% 95%,50% 70%,33% 95%,12% 88%" onclick="selectStructure('breast')"></button>`;
if(k==="abdomen")z=`
<button class="zone poly" data-label="肝臓" style="left:42.3%;top:42.4%;width:11.5%;height:8.1%;--poly:3% 26%,28% 7%,66% 4%,96% 28%,88% 63%,58% 91%,25% 83%,6% 58%" onclick="selectStructure('liver')"></button>
