<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Medical Guideline Library</title>
<style>
:root{--ink:#3b2818;--line:#6c472955;--paper:#e2c28c}*{box-sizing:border-box}body{margin:0;background:#1b1109;color:var(--ink);font-family:"Yu Mincho","Hiragino Mincho ProN",Georgia,serif}
.app{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 390px;background:linear-gradient(90deg,#9b6c3d,#d6ae72 8%,#dfc28d 50%,#b9864e)}
.atlas{position:relative;overflow:hidden;min-height:100vh}.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .6s,transform .82s cubic-bezier(.2,.8,.2,1);transform-origin:50% 50%}.home{opacity:1}.anatomy{opacity:0;filter:sepia(.12) saturate(.88);mix-blend-mode:multiply}
.atlas.reveal .home{opacity:.13}.atlas.reveal .anatomy{opacity:1}.atlas.zoom .layer{transform:translate(var(--tx),var(--ty)) scale(var(--s))}
.hot{position:absolute;z-index:5;border:0;background:transparent;border-radius:45%;cursor:pointer}.hot:hover{outline:1px dashed #5b391e99;background:#f0ca7d22}.tag{position:absolute;z-index:8;top:18px;left:18px;background:#e7c88edd;border:1px solid var(--line);padding:9px 12px;font-size:12px;box-shadow:2px 3px 9px #38200e44}.back{position:absolute;z-index:8;right:18px;bottom:18px;border:1px solid var(--line);background:#dfbc7f;padding:9px 13px;font:12px inherit}
.catalog{min-height:100vh;background:#e0c18be8;border-left:1px solid var(--line);padding:19px;box-shadow:-5px 0 20px #24140755}.brand{font:21px/1.04 Georgia,serif;letter-spacing:.12em;margin-bottom:16px}.search{display:flex;border:1px solid var(--line);background:#edd19e}.search input{flex:1;min-width:0;border:0;background:none;padding:12px;font:13px inherit;outline:0}.search button{border:0;border-left:1px solid var(--line);background:none;font-family:inherit;padding:0 13px}
h2{font:17px Georgia,serif;letter-spacing:.06em}.crumb{font-size:10px;opacity:.65;margin:8px 0 14px}.subs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px}.subs button{border:1px solid var(--line);background:#e5c58c;padding:6px 8px;font:11px inherit}.subs button.on{background:#4a321f;color:#eed6a9}.results{max-height:69vh;overflow:auto}.card{padding:10px 2px;border-top:1px solid var(--line);cursor:pointer}.card:hover{background:#f0d5a344}.title{font-size:13px;line-height:1.5}.meta{font-size:10px;opacity:.66;margin-top:3px}.badge{display:inline-block;border:1px solid var(--line);font-size:9px;padding:1px 4px;margin-top:5px}.hint{font-size:10px;line-height:1.7;opacity:.65}
.drawer{position:fixed;right:0;top:0;width:min(500px,100%);height:100%;z-index:30;background:#dfbf85;padding:24px;box-shadow:-10px 0 30px #160d0788;transform:translateX(105%);transition:.35s;overflow:auto}.drawer.open{transform:none}.drawer .x{float:right;border:0;background:none;font-size:26px}.drawer h1{font-size:21px;line-height:1.55}.dl{display:grid;grid-template-columns:85px 1fr;gap:7px 12px;font-size:12px;margin:22px 0}.dl b{opacity:.6}.links{display:grid;gap:7px}.links a{color:var(--ink);text-decoration:none;border:1px solid var(--line);padding:9px;background:#ebcd96}
@media(max-width:850px){.app{display:block}.atlas{height:67vh;min-height:520px}.catalog{min-height:auto;border-left:0;border-top:1px solid var(--line);padding:13px}.brand{font-size:16px}.results{max-height:none}.tag{top:9px;left:9px}.back{right:9px;bottom:9px}}
</style></head><body><div class="app"><main class="atlas" id="atlas">
<img class="layer home" src="home_atlas.png"><img class="layer anatomy" src="anatomy_color.png">
<div class="tag" id="tag">ANATOMICAL INDEX — 人体をタップ</div>
<button class="hot" style="left:43%;top:8%;width:14%;height:13%" onclick="pick('head')"></button><button class="hot" style="left:44%;top:20%;width:12%;height:8%" onclick="pick('neck')"></button><button class="hot" style="left:37%;top:27%;width:26%;height:17%" onclick="pick('chest')"></button><button class="hot" style="left:39%;top:43%;width:22%;height:17%" onclick="pick('abdomen')"></button><button class="hot" style="left:40%;top:58%;width:20%;height:11%" onclick="pick('pelvis')"></button><button class="hot" style="left:13%;top:42%;width:17%;height:16%" onclick="pick('hand')"></button><button class="hot" style="left:70%;top:42%;width:17%;height:16%" onclick="pick('hand')"></button><button class="hot" style="left:37%;top:68%;width:26%;height:13%" onclick="pick('knee')"></button><button class="hot" style="left:37%;top:87%;width:26%;height:12%" onclick="pick('foot')"></button>
<button class="back" onclick="resetAtlas()">← 全身へ戻る</button></main>
<aside class="catalog"><div class="brand">MEDICAL GUIDELINE LIBRARY<br><small>診療ガイドライン図書館</small></div><div class="search"><input id="q" placeholder="蔵書を検索…" oninput="render()"><button>検索</button></div><div class="crumb" id="crumb">全身 ＞ 全ガイドライン</div><h2 id="heading">CATALOGUE</h2><div class="subs" id="subs"></div><div class="results" id="results"></div><p class="hint">古典人体図 → 部位へズーム → カラー解剖図 → サブカテゴリ → ガイドライン。部位分類は今後マスター辞書でさらに精密化できます。</p></aside></div>
<aside class="drawer" id="drawer"><button class="x" onclick="drawer.classList.remove('open')">×</button><div id="detail"></div></aside>
<script>
let DATA=[],region="",sub="";const C={
head:{n:"頭・顔",s:2.25,x:"0%",y:"32%",k:["脳","神経","眼","耳","鼻","口腔","歯","頭頸"],subs:["脳・神経","眼","耳鼻咽喉","口腔・歯科"]},
neck:{n:"頸部",s:2.5,x:"0%",y:"25%",k:["頸","甲状腺","咽頭","喉頭","頸椎"],subs:["頸椎","甲状腺","咽喉頭","頸部血管"]},
chest:{n:"胸部",s:2.1,x:"0%",y:"14%",k:["胸","肺","呼吸","心","循環","乳"],subs:["肺・呼吸器","心臓・血管","乳腺","食道"]},
abdomen:{n:"腹部",s:2.2,x:"0%",y:"-4%",k:["腹","肝","胆","膵","胃","腸","腎","消化"],subs:["肝臓","胆嚢・胆道","膵臓","胃","小腸","大腸","腎臓","副腎","脾臓"]},
pelvis:{n:"骨盤",s:2.3,x:"0%",y:"-21%",k:["骨盤","膀胱","前立腺","子宮","卵巣","泌尿","婦人"],subs:["膀胱・尿路","前立腺","子宮・卵巣","大腸・直腸","股関節"]},
hand:{n:"手・手関節",s:2.35,x:"0%",y:"0%",k:["手","手関節","上肢","末梢神経"],subs:["手外科","末梢神経","腱・靱帯","骨折"]},
knee:{n:"膝",s:2.5,x:"0%",y:"-40%",k:["膝","半月板","靱帯","下肢"],subs:["変形性膝関節症","靱帯・半月板","骨折","スポーツ"]},
foot:{n:"足・足関節",s:2.45,x:"0%",y:"-55%",k:["足","足関節","下肢"],subs:["足外科","足関節","腱・靱帯","骨折","スポーツ"]}};
fetch("guidelines.json").then(r=>r.json()).then(d=>{DATA=d;render()});
function text(r){return [r.title,r.organization,r.publisher,r.specialty,r.specialty2,r.diseaseCategory,r.diseaseGroup,r.diseases,r.body,r.bodyRegions].join(" ")}
function pick(k){region=k;sub="";let c=C[k],a=document.getElementById("atlas");a.classList.add("reveal","zoom");a.style.setProperty("--s",c.s);a.style.setProperty("--tx",c.x);a.style.setProperty("--ty",c.y);document.getElementById("tag").textContent=c.n+" — ANATOMY";render()}
function resetAtlas(){region="";sub="";document.getElementById("atlas").classList.remove("reveal","zoom");document.getElementById("tag").textContent="ANATOMICAL INDEX — 人体をタップ";render()}
function setSub(s){sub=sub===s?"":s;render()}
function render(){let q=document.getElementById("q").value.trim();let arr=DATA.filter(r=>{let t=text(r);return(!q||t.includes(q))&&(!region||C[region].k.some(k=>t.includes(k)))&&(!sub||sub.split("・").some(k=>k&&t.includes(k)))}).sort((a,b)=>(b.year||0)-(a.year||0));document.getElementById("heading").textContent=(region?C[region].n:"CATALOGUE")+" — "+arr.length+"冊";document.getElementById("crumb").textContent=region?"全身 ＞ "+C[region].n+(sub?" ＞ "+sub:""):"全身 ＞ 全ガイドライン";document.getElementById("subs").innerHTML=region?C[region].subs.map(s=>`<button class="${sub===s?'on':''}" onclick="setSub('${s}')">${s}</button>`).join(""):"";document.getElementById("results").innerHTML=arr.slice(0,160).map(r=>`<div class="card" onclick="openD('${r.id}')"><div class="title">${esc(r.title)}</div><div class="meta">${esc(r.organization||"")}　${r.year||""}</div><span class="badge">${esc(r.access||"未確認")}</span></div>`).join("")||'<p class="hint">該当する蔵書はありません。</p>'}
function openD(id){let r=DATA.find(x=>x.id===id);if(!r)return;let L=[["公式",r.official],["本文",r.fulltext],["Minds",r.minds],["出版社",r.publisherUrl]].filter(x=>x[1]);document.getElementById("detail").innerHTML=`<p>${esc(r.id||"")}</p><h1>${esc(r.title)}</h1><div class="dl"><b>発行年</b><span>${r.year||"—"}</span><b>学会</b><span>${esc(r.organization||"—")}</span><b>診療科</b><span>${esc(r.specialty||"—")}</span><b>疾患</b><span>${esc(r.diseases||r.diseaseCategory||"—")}</span><b>アクセス</b><span>${esc(r.access||"—")}</span><b>価格</b><span>${r.price?"¥"+Number(r.price).toLocaleString():"—"}</span></div><div class="links">${L.map(x=>`<a href="${esc(x[1])}" target="_blank">${x[0]} →</a>`).join("")}</div>`;document.getElementById("drawer").classList.add("open")}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
</script></body></html>
