<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Medical Guideline Library</title>
<style>
:root{--ink:#3c2817;--muted:#745b3e;--line:#68452355;--paper:#e4c590;--dark:#2c1d12}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#1b1008;color:var(--ink)}
body{font-family:"Yu Mincho","Hiragino Mincho ProN",Georgia,serif}
.app{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 410px;background:linear-gradient(90deg,#8c5d34,#d2a86d 8%,#dfc18a 50%,#b77e48)}
.atlas{position:relative;overflow:hidden;min-height:100vh;touch-action:manipulation}.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .55s,transform .82s cubic-bezier(.2,.8,.2,1);transform-origin:50% 50%}
.home{opacity:1}.anatomy{opacity:0;filter:sepia(.10) saturate(.9);mix-blend-mode:multiply}.atlas.reveal .home{opacity:.11}.atlas.reveal .anatomy{opacity:1}.atlas.zoom .layer,.atlas.zoom .map{transform:translate(var(--tx),var(--ty)) scale(var(--s))}
.map{position:absolute;inset:0;z-index:6;transition:transform .82s cubic-bezier(.2,.8,.2,1);transform-origin:50% 50%;pointer-events:none}
.zone{position:absolute;border:0;background:transparent;pointer-events:auto;cursor:pointer;border-radius:20%;-webkit-tap-highlight-color:transparent}.poly{clip-path:polygon(var(--poly));border-radius:0}.zone:hover,.zone:focus{outline:1px dashed #5b381f99;background:#f4d18a25}.zone:active{background:#8d5d2f35}.zone.chosen{outline:2px solid #5c351dcc;background:#d7a65742;box-shadow:0 0 0 5px #f1d49c33 inset}
.zone::after{content:attr(data-label);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:9px Georgia,serif;letter-spacing:.05em;color:#4a2f19;opacity:0;white-space:nowrap;text-shadow:0 1px #f1d49c}.atlas.reveal .zone:hover::after{opacity:1}
.tag,.back,.catalogBtn{position:absolute;z-index:12;border:1px solid var(--line);background:#e6c68edb;box-shadow:2px 3px 9px #38200e44;font:11px inherit;color:var(--ink)}
.tag{top:16px;left:16px;padding:9px 12px}.back{right:16px;bottom:16px;padding:9px 12px}.catalogBtn{right:16px;top:16px;padding:9px 12px}
.catalog{min-height:100vh;background:#dfc18be9;border-left:1px solid var(--line);padding:18px;box-shadow:-5px 0 20px #24140755}.brand{font:20px/1.05 Georgia,serif;letter-spacing:.12em;margin-bottom:14px}.brand small{font:10px "Yu Mincho",serif;letter-spacing:.18em}
.search{display:flex;border:1px solid var(--line);background:#edd09c}.search input{flex:1;min-width:0;border:0;background:none;padding:11px;font:13px inherit;outline:0}.search button{border:0;border-left:1px solid var(--line);background:none;font-family:inherit;padding:0 12px}
.crumb{font-size:10px;opacity:.64;margin:8px 0 12px}.filters{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:9px}.filterTitle{display:flex;justify-content:space-between;align-items:center;font:12px Georgia,serif;letter-spacing:.08em;cursor:pointer}.filterBody{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.filterBody.hidden{display:none}
select{width:100%;border:1px solid var(--line);background:#e8c990;color:var(--ink);padding:7px 5px;font:11px inherit}.reset{grid-column:1/-1;border:1px solid var(--line);background:transparent;padding:6px;font:10px inherit;color:var(--ink)}
h2{font:16px Georgia,serif;letter-spacing:.06em;margin:10px 0}.subs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}.subs button{border:1px solid var(--line);background:#e7c78e;padding:5px 7px;font:10px inherit}.subs button.on{background:var(--dark);color:#eed6a9}
.results{max-height:58vh;overflow:auto}.card{padding:9px 2px;border-top:1px solid var(--line);cursor:pointer}.card:hover{background:#f1d5a33d}.title{font-size:12px;line-height:1.5}.meta{font-size:9px;opacity:.68;margin-top:3px}.badge{display:inline-block;border:1px solid var(--line);font-size:8px;padding:1px 4px;margin-top:4px}.hint{font-size:9px;line-height:1.65;opacity:.62}
.drawer{position:fixed;right:0;top:0;width:min(510px,100%);height:100%;z-index:40;background:#dfbf85;padding:24px;box-shadow:-10px 0 30px #160d0788;transform:translateX(105%);transition:.35s;overflow:auto}.drawer.open{transform:none}.x{float:right;border:0;background:none;font-size:26px}.drawer h1{font-size:20px;line-height:1.55}.dl{display:grid;grid-template-columns:85px 1fr;gap:7px 12px;font-size:12px;margin:20px 0}.dl b{opacity:.58}.links{display:grid;gap:7px}.links a{color:var(--ink);text-decoration:none;border:1px solid var(--line);padding:9px;background:#ebcd96}
.mobileSheet{display:none}
@media(max-width:850px){.app{display:block}.atlas{height:66vh;min-height:510px}.catalog{min-height:auto;border-left:0;border-top:1px solid var(--line);padding:13px}.brand{font-size:15px}.results{max-height:none}.tag{top:8px;left:8px}.back{right:8px;bottom:8px}.catalogBtn{top:8px;right:8px}.filterBody{grid-template-columns:1fr 1fr}.zone::after{display:none}}
.routeSearch{margin:10px 0 0;padding:10px 0;border-top:1px solid var(--line)}.specialtySearch{margin:10px 0 12px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.specialtyHead{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:bold;margin-bottom:8px}.specialtyHead button{border:1px solid var(--line);background:transparent;font:9px inherit;color:var(--ink);padding:3px 7px}
.specialtyChips{display:flex;gap:5px;flex-wrap:wrap;max-height:96px;overflow:auto}.specialtyChips button{border:1px solid var(--line);background:#e8ca94;color:var(--ink);font:10px inherit;padding:5px 7px;cursor:pointer}.specialtyChips button.on{background:#352215;color:#f0d7aa}
.resultTools{display:flex;justify-content:space-between;align-items:center}.resultTools select{width:auto;min-width:92px}.matchwhy{font-size:8px;opacity:.55;margin-top:3px}
/* v12 UX */
.uxbar{position:sticky;top:0;z-index:50;background:rgba(238,224,190,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:7px 0}
.uxinner{display:flex;gap:7px;align-items:center}.uxinner input{flex:1;margin:0}.uxbtn{width:auto;white-space:nowrap}
.activeFilters{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}.filterChip{border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:9px;background:rgba(255,255,255,.25)}
.resultCount{font-size:10px;opacity:.65;margin-left:6px;font-weight:400}
#toTop{position:fixed;right:15px;bottom:18px;z-index:80;width:42px;height:42px;border-radius:50%;display:none}
.mobileFilterBtn{display:none}
.emptyState{text-align:center;padding:32px 14px;border:1px dashed var(--line);margin-top:12px}
@media(max-width:760px){
 .mobileFilterBtn{display:inline-block}
 .filtersPanel{display:none}.filtersPanel.open{display:block}
 .uxinner{padding:0 8px}.uxinner input{min-width:0}
 .atlas{min-height:54vh}.catalog{padding-top:4px}
 .resultTools{position:sticky;top:49px;z-index:20;background:rgba(238,224,190,.93);padding:6px 0}
}

/* v17 clean seven-route interaction */
.routeMap{pointer-events:none!important}
.routeZone{position:absolute;border:0;background:transparent;pointer-events:auto;z-index:8;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.routeZone:active{background:rgba(109,70,32,.12)}
.rz-head{left:42%;top:7%;width:16%;height:12%}
.rz-neck{left:43%;top:19%;width:14%;height:8%}
.rz-chest{left:36%;top:27%;width:28%;height:16%}
.rz-arm-l{left:8%;top:25%;width:28%;height:31%}
.rz-arm-r{left:64%;top:25%;width:28%;height:31%}
.rz-abdomen{left:37%;top:43%;width:26%;height:15%}
.rz-pelvis{left:36%;top:58%;width:28%;height:12%}
.rz-lower{left:31%;top:70%;width:38%;height:28%}
.indexShade{display:none;position:absolute;inset:0;z-index:19;background:rgba(38,22,10,.22)}
.indexShade.open{display:block}
.indexPopup{display:none;position:absolute;z-index:20;left:5%;right:5%;bottom:4%;max-height:48%;overflow:auto;background:rgba(235,211,163,.97);border:1px solid var(--line);box-shadow:0 12px 35px rgba(35,19,8,.38);padding:13px}
.indexPopup.open{display:block}
.indexHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:8px}
.indexHead small{font:8px Georgia,serif;letter-spacing:.18em;opacity:.55}.indexHead h3{font:18px Georgia,serif;margin:2px 0 0}.indexHead button{border:0;background:none;font-size:25px;color:var(--ink)}
.indexGroup{margin-top:10px}.indexGroup>div:first-child{font-size:9px;letter-spacing:.12em;opacity:.58;margin-bottom:5px}
.indexChoices{display:flex;flex-wrap:wrap;gap:6px}.indexChoices button{border:1px solid var(--line);background:#ead09c;padding:7px 9px;font:11px inherit;color:var(--ink)}
@media(max-width:760px){
 .indexPopup{position:fixed;left:8px;right:8px;bottom:12px;max-height:54vh;z-index:1001}
 .indexShade{position:fixed;z-index:1000}
 .routeZone{min-width:44px;min-height:44px}
}

/* v19 hit-area recalibration */
.rz-head{left:40%!important;top:5%!important;width:20%!important;height:14%!important;z-index:14!important}
.rz-neck{left:40%!important;top:19%!important;width:20%!important;height:8%!important;z-index:13!important}
.rz-chest{left:34%!important;top:27%!important;width:32%!important;height:17%!important;z-index:10!important}

/* upper limb = shoulder through elbow to hand, both sides */
.rz-arm-l{left:4%!important;top:22%!important;width:32%!important;height:36%!important;z-index:11!important}
.rz-arm-r{left:64%!important;top:22%!important;width:32%!important;height:36%!important;z-index:11!important}

/* pelvis is intentionally narrow: hip + genital/pelvic region only */
.rz-pelvis{left:34%!important;top:57%!important;width:32%!important;height:13%!important;z-index:12!important}
/* lower limb starts at thigh and continues to foot */
.rz-lower{left:27%!important;top:68%!important;width:46%!important;height:31%!important;z-index:9!important}

/* catalogue/readability: stronger Japanese text without changing the classical design */
.results,.result,.card,.catalogue,.summary,.count,.crumb,.meta,
.results h2,.results h3,.card h3,.card p,.result p{
  font-weight:500;
  text-rendering:optimizeLegibility;
  -webkit-font-smoothing:antialiased;
}
.card h3,.result h3,.results h2{font-weight:650!important;letter-spacing:.015em}
.meta,.crumb,.summary,.count{font-weight:550!important;color:rgba(54,36,21,.88)!important}
.card p,.result p{line-height:1.65!important}
@media(max-width:760px){
 .results,.result,.card,.catalogue,.summary{font-size:max(14px,1em)}
 .meta,.crumb,.count{font-size:max(12px,.95em)}
 .card h3,.result h3{font-size:max(16px,1.08em)}
}
</style></head><body>
<div class="uxbar"><div class="uxinner">
<input id="quickSearch" placeholder="ガイドライン名・疾患・学会名を検索" oninput="syncQuickSearch(this.value)">
<button class="uxbtn mobileFilterBtn" onclick="toggleFilters()">絞り込み</button>
<button class="uxbtn" onclick="resetAll()">リセット</button>
</div><div id="activeFilters" class="activeFilters"></div></div>
<button id="toTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="ページ上部へ">↑</button><div class="app">
<main class="atlas" id="atlas">
<img class="layer home" src="home_atlas.png" alt="古典人体図"><img class="layer anatomy" src="anatomy_color.png" alt="カラー解剖図">
<div class="tag" id="tag">人体索引 — 部位をタップ</div><button class="catalogBtn" onclick="document.getElementById('q').focus()">蔵書検索</button>
<div class="map routeMap" id="map">
<button class="routeZone rz-head" data-region="head" aria-label="頭"></button>
<button class="routeZone rz-neck" data-region="neck" aria-label="首"></button>
<button class="routeZone rz-chest" data-region="chest" aria-label="胸部"></button>
<button class="routeZone rz-arm-l" data-region="upper" aria-label="肩から手 左"></button>
<button class="routeZone rz-arm-r" data-region="upper" aria-label="肩から手 右"></button>
<button class="routeZone rz-abdomen" data-region="abdomen" aria-label="腹部"></button>
<button class="routeZone rz-pelvis" data-region="pelvis" aria-label="骨盤まわり"></button>
<button class="routeZone rz-lower" data-region="lower" aria-label="下肢"></button>
</div>
<div class="indexShade" id="indexShade" onclick="closeIndex()"></div>
<section class="indexPopup" id="indexPopup" aria-hidden="true">
 <div class="indexHead"><div><small>ANATOMICAL INDEX</small><h3 id="indexTitle">部位を選択</h3></div><button onclick="closeIndex()" aria-label="閉じる">×</button></div>
 <div id="indexBody"></div>
</section><button class="back" onclick="resetAtlas()">← 全身へ戻る</button></main>
<aside class="catalog"><div class="brand">MEDICAL GUIDELINE LIBRARY<br><small>診療ガイドライン図書館</small></div>
<div class="search"><input id="q" placeholder="疾患名・学会名・ガイドライン名…" oninput="render()"><button>検索</button></div><div class="crumb" id="crumb">全身 ＞ 全ガイドライン</div>
<div class="filtersPanel" id="filtersPanel"><section class="routeSearch"><div class="specialtyHead">探し方</div><div class="specialtyChips">
<button onclick="setRoute('')">すべて</button><button onclick="setRoute('body')">人体・臓器から</button><button onclick="setRoute('systemic')">全身・部位によらない</button>
</div></section><section class="specialtySearch">
<div class="specialtyHead">診療科から探す <button id="spClear" onclick="pickSpecialty('')">すべて</button></div>
<div class="specialtyChips" id="specialtyChips"></div>
</section>
<div class="filters"><div class="filterTitle" onclick="toggleFilters()">蔵書目録 / カテゴリ検索 <span id="fmark">−</span></div><div class="filterBody" id="filterBody">
<select id="fSpecialty" onchange="render()"><option value="">診療科：すべて</option></select><select id="fDisease" onchange="render()"><option value="">疾患群：すべて</option></select>
<select id="fBody" onchange="render()"><option value="">身体部位：すべて</option></select><select id="fOrg" onchange="render()"><option value="">発行学会：すべて</option></select>
<select id="fYear" onchange="render()"><option value="">発行年：すべて</option></select><select id="fAccess" onchange="render()"><option value="">アクセス：すべて</option></select>
<button class="reset" onclick="clearFilters()">検索条件をクリア</button></div></div>
<div class="crumb" id="activeFilters"></div></div><div class="resultTools"><h2 id="heading">蔵書一覧</h2><select id="sortMode" onchange="render()"><option value="new">新しい順</option><option value="old">古い順</option><option value="title">名称順</option></select></div><div class="subs" id="subs"></div><div class="results" id="results"></div><p class="hint">分類は原データを保持したまま、検索時のみ表記揺れ（例：頚椎→頸椎、膝関節→膝）を吸収します。</p><p class="hint">人体マップとカテゴリ検索は同じ検索状態として連動します。人体索引は身体部位・疾患・タイトルを優先して照合します。ズーム後はINDEXから解剖構造を選択します。臓器選択後も発行年・学会・アクセス条件を追加できます。</p></aside></div>
<aside class="drawer" id="drawer"><button class="x" onclick="drawer.classList.remove('open')">×</button><div id="detail"></div></aside>
<script>
let DATA=[],area="",structure="",sub="",route="";
const JP={
"PAID":"有料","PAYD":"有料","FREE":"無料","OPEN_ACCESS":"無料公開","OPEN":"無料公開",
"MEMBER_ONLY":"会員限定","MEMBERS_ONLY":"会員限定","MEMBER":"会員限定",
"PARTIAL_FREE":"一部無料","WEB_FREE":"Web無料公開","BOOK_ONLY":"書籍のみ",
"PURCHASE":"購入","PAID_BOOK":"有料（書籍）","FREE_PDF":"無料PDF",
"UNVERIFIED":"未確認","PENDING":"確認中","UNKNOWN":"未確認",
"PRIMARY":"診療ガイドライン","GUIDANCE":"指針・手引き","OTHER":"その他",
"ORTHOPEDICS":"整形外科","UROLOGY":"泌尿器科","GYNECOLOGY":"婦人科","OBGYN":"産婦人科",
"NEUROLOGY":"神経内科","NEUROSURGERY":"脳神経外科","CARDIOLOGY":"循環器内科",
"RESPIRATORY":"呼吸器","GASTROENTEROLOGY":"消化器","HEPATOLOGY":"肝胆膵",
"PEDIATRICS":"小児科","DERMATOLOGY":"皮膚科","OPHTHALMOLOGY":"眼科",
"OTOLARYNGOLOGY":"耳鼻咽喉科","PSYCHIATRY":"精神科","RHEUMATOLOGY":"リウマチ科",
"ENDOCRINOLOGY":"内分泌・代謝","HEMATOLOGY":"血液内科","ONCOLOGY":"腫瘍",
"INFECTIOUS_DISEASE":"感染症","EMERGENCY":"救急","ANESTHESIOLOGY":"麻酔科",
"REHABILITATION":"リハビリテーション科"
};
function jp(v){
 if(v===null||v===undefined||v==="")return "";
 let x=String(v).trim(),u=x.toUpperCase().replace(/[\s-]+/g,"_");
 return JP[u]||JP[x]||x.replace(/_/g," ");
}

const A={head:{n:"頭部",s:2.80,x:"0%",y:"34%"},neck:{n:"頸部",s:3.05,x:"0%",y:"27%"},chest:{n:"胸部",s:2.30,x:"0%",y:"15%"},abdomen:{n:"腹部",s:2.48,x:"0%",y:"-2%"},pelvis:{n:"骨盤",s:2.58,x:"0%",y:"-19%"}};
const S={
brain:{n:"脳",k:["脳","神経","頭蓋"]},eye:{n:"眼",k:["眼","視"]},thyroid:{n:"甲状腺",k:["甲状腺"]},lung:{n:"肺・呼吸器",k:["肺","呼吸","気管支"]},heart:{n:"心臓",k:["心","循環","冠動脈"]},breast:{n:"乳腺",k:["乳"]},
liver:{n:"肝臓",k:["肝"]},gall:{n:"胆嚢・胆道",k:["胆"]},pancreas:{n:"膵臓",k:["膵"]},stomach:{n:"胃",k:["胃"]},smallint:{n:"小腸",k:["小腸"]},colon:{n:"大腸・直腸",k:["大腸","結腸","直腸"]},kidney:{n:"腎臓",k:["腎"]},bladder:{n:"膀胱・尿路",k:["膀胱","尿路","泌尿"]},prostate:{n:"前立腺",k:["前立腺"]},uterus:{n:"子宮・卵巣",k:["子宮","卵巣","婦人"]},
hand:{n:"手・手関節",k:["手","手関節","手外科"]},knee:{n:"膝",k:["膝","半月板","前十字","靱帯"]},foot:{n:"足・足関節",k:["足","足関節"]},
shoulder:{n:"肩関節",k:["肩","肩関節","腱板","上腕二頭筋"]},
elbow:{n:"肘関節",k:["肘","肘関節"]},
wrist:{n:"手・手関節",k:["手","手関節","手外科","手根"]},
hip:{n:"股関節",k:["股","股関節","大腿骨頭"]},
cspine:{n:"頸椎",k:["頸椎","頚椎","頸部脊椎"]},
tspine:{n:"胸椎",k:["胸椎"]},
lspine:{n:"腰椎",k:["腰椎","腰部脊椎","腰痛"]},
ankle:{n:"足関節",k:["足関節","足首","距骨"]}
};
const subs={hand:["手外科","末梢神経","腱・靱帯","骨折"],knee:["変形性膝関節症","靱帯・半月板","骨折","スポーツ"],foot:["足外科","足関節","腱・靱帯","骨折"],liver:["肝炎","肝硬変","肝癌"],lung:["肺癌","喘息","COPD","感染症"],heart:["虚血性心疾患","心不全","不整脈"],kidney:["CKD","腎炎","腎癌"],
shoulder:["腱板","肩関節不安定症","変形性肩関節症","骨折","スポーツ"],
elbow:["上顆炎","靱帯","骨折","スポーツ"],
wrist:["手外科","末梢神経","腱・靱帯","骨折"],
hip:["変形性股関節症","大腿骨頭壊死","骨折","スポーツ"],
cspine:["頸椎症","頸椎椎間板","脊髄症","骨折"],
tspine:["胸椎","脊髄","骨折"],
lspine:["腰痛","腰部脊柱管狭窄症","椎間板","腰椎分離症","骨折"],
ankle:["足関節","アキレス腱","靱帯","骨折","スポーツ"]};
fetch("guidelines.json").then(r=>r.json()).then(d=>{DATA=d.map(r=>({...r,
specialtyLabel:jp(r.specialtyLabel||r.specialty),
accessLabel:jp(r.access),
verifiedLabel:jp(r.verified)
}));buildFilters();render()});
function T(r){return [r.title,r.organization,r.publisher,r.specialtyLabel,r.specialty,r.specialty2,r.diseaseCategory,r.diseaseGroup,r.diseases,r.body,r.bodyRegions,r.searchAliases].join(" ")}
function fieldText(r){return {title:String(r.title||""),disease:[r.diseaseCategory,r.diseaseGroup,r.diseases].join(" "),body:[r.body,r.bodyRegions].join(" "),specialty:[r.specialtyLabel,r.specialty,r.specialty2].join(" ")}}
function anatomyMatch(r,key){if(!key)return true;let f=fieldText(r),ks=S[key].k;return ks.some(k=>f.body.includes(k)||f.disease.includes(k)||f.title.includes(k))}
function subMatch(r,x){if(!x)return true;let f=fieldText(r);return x.split("・").filter(Boolean).some(k=>f.disease.includes(k)||f.body.includes(k)||f.title.includes(k))}

const ROUTES={
 head:{n:"頭",s:3.15,x:"0%",y:"37%",groups:{"中枢神経":["脳・脳血管"],"感覚・顔面":["眼","耳","鼻・副鼻腔","口腔・歯科","顎・顔面"],"外傷":["頭部外傷"]}},

 chest:{n:"胸部",s:2.18,x:"0%",y:"14%",groups:{"臓器":["肺・気管支","心臓","冠動脈・大血管","乳腺","食道","縦隔"],"運動器":["胸椎・脊髄","胸壁・肋骨"]}},
 upper:{n:"上肢（肩〜手）",s:1.58,x:"0%",y:"7%",groups:{"関節・部位":["肩","上腕","肘","前腕","手・手関節"],"軟部・神経":["末梢神経","腱・靱帯"],"外傷":["上肢外傷"]}},
 abdomen:{n:"腹部",s:2.32,x:"0%",y:"-3%",groups:{"消化器":["肝臓","胆嚢・胆道","膵臓","胃・十二指腸","小腸","大腸"],"後腹膜・その他":["腎臓・副腎","脾臓","腹壁・ヘルニア"],"運動器":["腰椎・脊髄"]}},
 pelvis:{n:"骨盤まわり",s:2.42,x:"0%",y:"-20%",groups:{"消化管":["直腸・肛門"],"泌尿・生殖":["膀胱・尿路","前立腺","子宮","卵巣・付属器","骨盤臓器"],"運動器":["股関節","骨盤・仙骨"]}},
 lower:{n:"下肢（大腿〜足）",s:1.58,x:"0%",y:"-26%",groups:{"関節・部位":["大腿","膝","下腿","足関節","足・足趾"],"軟部・神経・血管":["末梢神経","腱・靱帯","下肢血管"],"外傷":["下肢外傷"]}}
};
const ITEM_KEY={"脳・脳血管":"brain","眼":"eye","甲状腺・副甲状腺":"thyroid","肺・気管支":"lung","心臓":"heart","乳腺":"breast","肝臓":"liver","胆嚢・胆道":"gall","膵臓":"pancreas","胃・十二指腸":"stomach","小腸":"smallint","大腸":"colon","腎臓・副腎":"kidney","膀胱・尿路":"bladder","前立腺":"prostate","子宮":"uterus","頸椎・脊髄":"cspine","胸椎・脊髄":"tspine","腰椎・脊髄":"lspine","肩":"shoulder","肘":"elbow","手・手関節":"wrist","股関節":"hip","膝":"knee","足関節":"ankle","足・足趾":"foot"};
function openRoute(k,side=""){
 const r=ROUTES[k]; if(!r)return;
 // Critical: clear the previous organ/subcategory every time a new region is touched.
 area=k;structure="";sub="";
 atlas.classList.add("reveal","zoom");
 let x=r.x;
 if(k==="upper"&&side==="L")x="15%";
 if(k==="upper"&&side==="R")x="-15%";
 atlas.style.setProperty("--s",r.s);atlas.style.setProperty("--tx",x);atlas.style.setProperty("--ty",r.y);
 tag.textContent=r.n+" — 解剖構造を選択";
 indexTitle.textContent=r.n+" — INDEX";
 indexBody.innerHTML=Object.entries(r.groups).map(([g,items])=>`<div class="indexGroup"><div>${g}</div><div class="indexChoices">${items.map(v=>`<button type="button" onclick="chooseIndex('${v.replaceAll("'","")}')">${v}</button>`).join("")}</div></div>`).join("");
 indexShade.classList.add("open");indexPopup.classList.add("open");indexPopup.setAttribute("aria-hidden","false");
 render();
}
function closeIndex(){indexShade.classList.remove("open");indexPopup.classList.remove("open");indexPopup.setAttribute("aria-hidden","true")}
function chooseIndex(label){
 const key=ITEM_KEY[label];
 structure=key&&S[key]?key:"";sub=structure?"":label;
 tag.textContent=label+" — 選択中";
 closeIndex();render();
}
function resetAtlas(){
 area="";structure="";sub="";
 atlas.classList.remove("reveal","zoom");
 atlas.style.removeProperty("--s");atlas.style.removeProperty("--tx");atlas.style.removeProperty("--ty");
 tag.textContent="人体索引 — 部位をタップ";closeIndex();render();
}
function bindRouteZones(){
 document.querySelectorAll(".routeZone").forEach(b=>{
  b.addEventListener("click",e=>{
   e.preventDefault();e.stopPropagation();
   const side=b.classList.contains("rz-arm-l")?"L":b.classList.contains("rz-arm-r")?"R":"";
   openRoute(b.dataset.region,side);
  });
 });
}
document.addEventListener("DOMContentLoaded",bindRouteZones);
function setSub(s){sub=sub===s?"":s;render()}
function pickSpecialty(v){document.getElementById("fSpecialty").value=v;render()}
function syncSpecialty(){let v=document.getElementById("fSpecialty").value;document.querySelectorAll("#specialtyChips button").forEach(b=>b.classList.toggle("on",b.dataset.sp===v))}
function setRoute(v){route=v;if(v==="systemic")resetAtlas();render()}

function syncQuickSearch(v){let q=document.getElementById("q");if(q)q.value=v;render()}
function toggleFilters(){document.getElementById("filtersPanel")?.classList.toggle("open")}
function resetAll(){
 route="";resetAtlas();
 ["q","specialty","disease","body","org","year","access"].forEach(id=>{let e=document.getElementById(id);if(e)e.value=""});
 let qs=document.getElementById("quickSearch");if(qs)qs.value="";
 document.querySelectorAll(".zone,.specialtyChips button").forEach(e=>e.classList.remove("chosen","active"));
 render();
}
function filterSummary(){
 let a=[];if(structure)a.push("人体："+S[structure].n);if(route==="systemic")a.push("全身・横断");
 [["specialty","診療科"],["disease","疾患"],["body","部位"],["org","学会"],["year","年"],["access","公開"]].forEach(([id,l])=>{let e=document.getElementById(id);if(e&&e.value)a.push(l+"："+(e.options?.[e.selectedIndex]?.text||e.value))});
 let q=document.getElementById("q")?.value;if(q)a.push("検索："+q);
 let box=document.getElementById("activeFilters");if(box)box.innerHTML=a.map(x=>`<span class="filterChip">${esc(x)}</span>`).join("");
}
function vals(id){return document.getElementById(id).value}
function render(){syncSpecialty();let q=qEl().value.trim(),sp=vals("fSpecialty"),dz=vals("fDisease"),bd=vals("fBody"),org=vals("fOrg"),yr=vals("fYear"),ac=vals("fAccess");let af=[];if(sp)af.push("診療科："+sp);if(dz)af.push("疾患："+dz);if(bd)af.push("部位："+bd);if(yr)af.push("年："+yr);if(ac)af.push("公開："+ac);activeFilters.textContent=af.length?"絞り込み｜"+af.join(" / "):"";let arr=DATA.filter(r=>{let t=T(r);let anatomy=anatomyMatch(r,structure);let routeOK=!route||(route==="body"?r.bodyAudit!=="部位不要候補":route==="systemic"?r.bodyAudit==="部位不要候補":true);return(!q||t.includes(q))&&anatomy&&subMatch(r,sub)&&routeOK&&(!sp||r.specialtyLabel===sp)&&(!dz||[r.diseaseCategory,r.diseaseGroup,r.diseases].join(" ").includes(dz))&&(!bd||[r.body,r.bodyRegions].join(" ").includes(bd))&&(!org||r.organization===org)&&(!yr||String(r.year)===yr)&&(!ac||r.accessLabel===ac)});let sm=document.getElementById("sortMode")?.value||"new";arr.sort((a,b)=>sm==="old"?(a.year||0)-(b.year||0):sm==="title"?String(a.title||"").localeCompare(String(b.title||""),"ja"):(b.year||0)-(a.year||0));filterSummary();heading.innerHTML=(structure?S[structure].n:"蔵書一覧")+" — "+arr.length+"冊";crumb.textContent="全身"+(area?" ＞ "+(ROUTES[area]?.n||""):"")+(structure?" ＞ "+S[structure].n:"")+(sub?" ＞ "+sub:"");document.getElementById("subs").innerHTML=structure&&subs[structure]?subs[structure].map(s=>`<button class="${sub===s?'on':''}" onclick="setSub('${s}')">${s}</button>`).join(""):"";results.innerHTML=arr.slice(0,180).map(r=>`<div class="card" onclick="openD('${r.id}')"><div class="title">${esc(r.title)}</div><div class="meta">${esc(r.organization||"")}　${r.year||""}　${esc(r.specialtyLabel||"")}</div><span class="badge">${esc(r.accessLabel||"未確認")}</span>${structure?`<div class="matchwhy">人体索引：${esc(S[structure].n)} に関連</div>`:""}</div>`).join("")||'<p class="hint">該当する蔵書はありません。</p>'}
function buildFilters(){let spl=unique(DATA.map(r=>r.specialtyLabel));fill("fSpecialty",spl,"診療科：すべて");
specialtyChips.innerHTML=spl.map(x=>`<button data-sp="${esc(x)}" onclick="pickSpecialty('${String(x).replace(/'/g,"\\'")}')">${esc(x)}</button>`).join("");fill("fOrg",unique(DATA.map(r=>r.organization)),"発行学会：すべて");fill("fYear",unique(DATA.map(r=>r.year)).sort((a,b)=>b-a),"発行年：すべて");fill("fAccess",unique(DATA.map(r=>r.accessLabel)),"アクセス：すべて");fill("fBody",unique(DATA.flatMap(r=>String(r.body||"").split(";"))),"身体部位：すべて");let ds=unique(DATA.flatMap(r=>String(r.diseases||"").split(";"))).filter(x=>x.length>1);fill("fDisease",ds.slice(0,300),"疾患群：すべて")}
function unique(a){return [...new Set(a.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"ja"))}function fill(id,a,first){let e=document.getElementById(id);e.innerHTML=`<option value="">${first}</option>`+a.map(x=>`<option>${esc(x)}</option>`).join("")}
function clearFilters(){["fSpecialty","fDisease","fBody","fOrg","fYear","fAccess"].forEach(id=>document.getElementById(id).value="");qEl().value="";render()}function toggleFilters(){filterBody.classList.toggle("hidden");fmark.textContent=filterBody.classList.contains("hidden")?"+":"−"}function qEl(){return document.getElementById("q")}
function openD(id){let r=DATA.find(x=>x.id===id);if(!r)return;let L=[["公式",r.official],["本文",r.fulltext],["Minds",r.minds],["出版社",r.publisherUrl]].filter(x=>x[1]);detail.innerHTML=`<p>${esc(r.id||"")}</p><h1>${esc(r.title)}</h1><div class="dl"><b>発行年</b><span>${r.year||"—"}</span><b>学会</b><span>${esc(r.organization||"—")}</span><b>診療科</b><span>${esc(r.specialtyLabel||r.specialty||"—")}</span><b>疾患</b><span>${esc(r.diseases||r.diseaseCategory||"—")}</span><b>アクセス</b><span>${esc(r.accessLabel||"—")}</span><b>価格</b><span>${r.price?"¥"+Number(r.price).toLocaleString():"—"}</span><b>確認状況</b><span>${esc(r.verifiedLabel||"確認済み")}</span><b>人体索引</b><span>${esc(r.bodyAudit==="部位不要候補"?"部位によらない":r.bodyAudit==="部位付与候補"?"分類確認中":r.bodyAudit==="判断保留"?"分類保留":"部位情報あり")}</span></div><div class="links">${L.map(x=>`<a href="${esc(x[1])}" target="_blank">${x[0]} →</a>`).join("")}</div>`;drawer.classList.add("open")}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

document.addEventListener("keydown",e=>{if(e.key==="Escape"){document.getElementById("filtersPanel")?.classList.remove("open");document.getElementById("drawer")?.classList.remove("open")}});
